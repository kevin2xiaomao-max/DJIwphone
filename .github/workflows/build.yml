name: DJIwphone device build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: DJIwphone build, test and IPA
    runs-on: macos-15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: Install XcodeGen and generate project
        run: brew install xcodegen && xcodegen generate
      - name: Install CocoaPods and resolve WebRTC
        run: gem install cocoapods --no-document && pod install --repo-update
      - name: Discover available iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          xcodebuild -workspace DJIwphone.xcworkspace -scheme DJIwphone -showdestinations
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted|Shutdown/ {print $2; exit}')
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Simulator XCTest
        run: xcodebuild test -workspace DJIwphone.xcworkspace -scheme DJIwphone -destination "id=$SIMULATOR_UDID" -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Simulator build
        run: xcodebuild build -workspace DJIwphone.xcworkspace -scheme DJIwphone -destination "id=$SIMULATOR_UDID" -derivedDataPath build/SimulatorBuild CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Device Release build and package
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -workspace DJIwphone.xcworkspace -scheme DJIwphone -sdk iphoneos -configuration Release -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          apps=()
          while IFS= read -r app_path; do apps+=("$app_path"); done < <(find build/Device/Build/Products -type d -path '*Release-iphoneos/*.app' -maxdepth 6 -print)
          test "${#apps[@]}" -eq 1
          test "$(basename "${apps[0]}")" = DJIwphone.app
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "${apps[0]}" ipa/Payload/DJIwphone.app
          (cd ipa && zip -qry ../DJIwphone.ipa Payload)
          bash scripts/validate_ipa.sh DJIwphone.ipa ipa-validation.txt
      - name: Upload one validated DJIwphone artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJIwphone-ipa
          path: |
            DJIwphone.ipa
            ipa-validation.txt
          if-no-files-found: error
